<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Faultline — system design failure lab</title>
<style>
:root{--bg:#0b0f14;--p:#121821;--p2:#18202b;--p3:#1f2937;--bd:#273242;--tx:#d7dde5;--mu:#8391a3;--ac:#4c9aff;--ok:#3fb950;--er:#f85149;--wa:#d29922;--pu:#a371f7}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:13px/1.45 system-ui,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--p2);border:1px solid var(--bd);border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--ac)}
button.pri{background:#1f4f8f;border-color:#2f6fc4}
button.warn{background:#4a1d1d;border-color:#7d2a2a}
button.sm{padding:2px 7px;font-size:12px}
input,select,textarea{background:var(--bg);border:1px solid var(--bd);border-radius:5px;padding:4px 6px;min-width:0}
input:focus,select:focus,textarea:focus{outline:1px solid var(--ac);border-color:var(--ac)}
h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:14px 0 6px;font-weight:600}
.muted{color:var(--mu)}
#top{display:flex;align-items:center;gap:6px;padding:7px 10px;background:var(--p);border-bottom:1px solid var(--bd);flex:none;overflow-x:auto}
.brand{font-weight:700;font-size:15px;margin-right:6px;white-space:nowrap}.brand small{font-weight:400;color:var(--mu);font-size:11px;margin-left:6px}
#sysName{width:210px;font-weight:600}
.sep{width:1px;height:22px;background:var(--bd);margin:0 4px;flex:none}
.seg{display:flex}.seg button{border-radius:0}.seg button:first-child{border-radius:6px 0 0 6px}.seg button:last-child{border-radius:0 6px 6px 0;border-left:0}
.seg button.on{background:#1f4f8f;border-color:#2f6fc4}
#clock{font-variant-numeric:tabular-nums;color:var(--mu);min-width:90px;text-align:right;margin-left:auto;white-space:nowrap}
#main{flex:1;display:grid;grid-template-columns:178px 1fr 340px;min-height:0}
#palette{background:var(--p);border-right:1px solid var(--bd);overflow-y:auto;padding:0 8px 12px}
.pi{display:flex;align-items:center;gap:7px;padding:5px 7px;border:1px solid transparent;border-radius:6px;cursor:grab;user-select:none}
.pi:hover{background:var(--p2);border-color:var(--bd)}.pi i{font-style:normal;width:18px;text-align:center}
#stage{position:relative;overflow:hidden;background:radial-gradient(circle at 1px 1px,#1a2330 1px,transparent 0) 0 0/22px 22px}
#svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:default}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#hint{position:absolute;left:10px;bottom:8px;color:var(--mu);font-size:11.5px;pointer-events:none;background:#0b0f14cc;padding:2px 6px;border-radius:4px}
#lag{position:absolute;right:10px;top:8px;color:var(--wa);font-size:12px;display:none}
.node{cursor:grab}.node .box{fill:#141c27;stroke:#2c394b;stroke-width:1.3}
.node:hover .box{stroke:#44556d}.node.sel .box{stroke:var(--ac);stroke-width:2.2}
.node.down .box{fill:#2a1416;stroke:var(--er)}.node.warnst .box{stroke:var(--wa)}
.node text{fill:var(--tx);font-size:12px;pointer-events:none;user-select:none}
.node .ico{font-size:17px}.node .nm{font-weight:600;font-size:12.5px}.node .ty{fill:var(--mu);font-size:10.5px}
.node .s1,.node .s2{font-size:10.5px;fill:#a9b6c6;font-variant-numeric:tabular-nums}
.node .gbg{fill:#1d2733}.node .gfill{fill:var(--ac)}
.node .dot{fill:#3a4658}.node .dot.g{fill:var(--ok)}.node .dot.a{fill:var(--wa)}.node .dot.r{fill:var(--er)}
.node .zap{fill:var(--wa);font-size:13px;display:none}.node.faulty .zap{display:block}
.node .port{fill:#0b0f14;stroke:var(--ac);stroke-width:1.6;cursor:crosshair;opacity:.35}
.node:hover .port{opacity:1}.node .port:hover{fill:var(--ac)}
.node.k-note{cursor:move}.node .note{font-size:13px;font-weight:600;fill:#9fb3cc;pointer-events:auto}
.node.k-note.sel .note{fill:var(--ac)}
.edge .ln{fill:none;stroke:#4b5b72;stroke-width:1.6}
.edge .hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}
.edge.async .ln{stroke-dasharray:6 5}
.edge.faulty .ln{stroke:var(--wa)}
.edge.sel .ln{stroke:var(--ac);stroke-width:2.6}
.edge.bad .ln{stroke:var(--er)}
.edge .el{font-size:10.5px;fill:#b7c3d2;text-anchor:middle;paint-order:stroke;stroke:#0b0f14;stroke-width:3.5px;pointer-events:none;font-variant-numeric:tabular-nums}
.edge.flow .ln{stroke-dasharray:7 9;animation:dash 1s linear infinite;animation-play-state:paused}
body.running .edge.flow .ln{animation-play-state:running}
.edge.flow.idle .ln{animation:none;stroke-dasharray:none;opacity:.5}
@keyframes dash{to{stroke-dashoffset:-16}}
.grp .gbox{fill:#4c9aff0b;stroke:#3b5273;stroke-width:1.4;stroke-dasharray:7 5}
.grp .ghd{fill:#1b2a3f;cursor:move}.grp:hover .ghd{fill:#223650}
.grp text{font-size:12px;fill:var(--tx);pointer-events:none;user-select:none}
.grp .gnm{font-weight:700}.grp .gst{fill:#a9b6c6;font-size:11px;text-anchor:end;font-variant-numeric:tabular-nums}
.grp .grs{fill:#3b5273;cursor:nwse-resize}.grp .grs:hover{fill:var(--ac)}
.grp.sel .gbox{stroke:var(--ac);stroke-width:2.2}
.grp.faulty .gbox{stroke:var(--wa)}
.grp.idle .gbox{fill:#8391a308;stroke:#55627a}.grp.idle .gst{fill:#8391a3}
.grp.down .gbox{stroke:var(--er);fill:#f8514912}.grp.down .ghd{fill:#3a1719}
.node .one{cursor:pointer}.node .one rect{fill:#1f4f8f;stroke:#2f6fc4;stroke-width:1}.node .one:hover rect{fill:#2f6fc4}.node .one text{fill:#fff;font-size:10px}
#bManual.on{background:#463610;border-color:#d29922}
#tmp{fill:none;stroke:var(--ac);stroke-width:2;stroke-dasharray:5 4;pointer-events:none}
#insp{background:var(--p);border-left:1px solid var(--bd);overflow-y:auto;padding:10px 12px 30px}
#insp .hd{display:flex;gap:6px;align-items:center}#insp .hd input{flex:1;font-weight:600}
.f{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0}
.f>span{flex:1;color:#b9c4d2}.f input[type=number],.f select,.f input[type=text]{width:132px}
.f input[type=checkbox]{width:16px;height:16px;accent-color:var(--ac)}
.rng{display:flex;align-items:center;gap:6px;width:132px}.rng input{flex:1;padding:0;accent-color:var(--wa)}.rng output{width:42px;text-align:right;font-variant-numeric:tabular-nums}
.q{display:inline-block;margin-left:5px;width:14px;height:14px;line-height:13px;text-align:center;border-radius:50%;border:1px solid var(--bd);color:var(--mu);font-size:10px;font-style:normal;cursor:help}
details.sec{border-top:1px solid var(--bd);margin-top:10px;padding-top:2px}
details.sec>summary{cursor:pointer;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);font-weight:600;padding:7px 0}
details.sec.flt>summary{color:var(--wa)}
.act{border:1px solid var(--bd);border-radius:7px;margin:6px 0;background:var(--p2)}
.act>summary{display:flex;align-items:center;gap:6px;padding:6px 8px;cursor:pointer;list-style:none}
.act>summary::-webkit-details-marker{display:none}
.act .ix{background:var(--ac);color:#04121f;border-radius:50%;width:18px;height:18px;text-align:center;font-weight:700;font-size:11px;line-height:18px;flex:none}
.act .tt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act .bd{padding:2px 9px 8px}
.chip{display:inline-block;font-size:10px;padding:0 6px;border-radius:9px;border:1px solid var(--bd);color:var(--mu);margin-left:3px}
.chip.g{color:var(--ok);border-color:#215b2b}.chip.w{color:var(--wa);border-color:#6b4d12}.chip.r{color:var(--er);border-color:#7d2a2a}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-variant-numeric:tabular-nums}.kv b{font-weight:500;text-align:right}
.sc{border:1px solid var(--bd);border-radius:7px;padding:8px;margin:7px 0;background:var(--p2)}
.sc b{display:block}.sc p{margin:3px 0 7px;color:#aab6c5;font-size:12px}
#desc{width:100%;min-height:150px;resize:vertical;font-size:12.5px;line-height:1.5}
#dock{height:280px;flex:none;background:var(--p);border-top:1px solid var(--bd);display:flex;flex-direction:column;min-height:0}
#dock.min{height:34px}#dock.min #dockbody{display:none}
#tabs{display:flex;gap:2px;padding:4px 8px 0;border-bottom:1px solid var(--bd);flex:none;align-items:center}
#tabs button{border:0;background:none;border-radius:6px 6px 0 0;padding:6px 12px;color:var(--mu)}
#tabs button.on{background:var(--p2);color:var(--tx);box-shadow:inset 0 2px 0 var(--ac)}
#tabs .sp{flex:1}
#dockbody{flex:1;min-height:0;overflow:hidden;padding:8px 10px}
.dash{display:grid;grid-template-columns:270px 1fr 1fr 1fr;gap:10px;height:100%}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:6px;align-content:start}
.kpi{background:var(--p2);border:1px solid var(--bd);border-radius:7px;padding:4px 8px;min-width:0;overflow:hidden}
.kpi small{display:block;color:var(--mu);font-size:10.5px;white-space:nowrap}.kpi b{font-size:14.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi.bad b{color:var(--er)}.kpi.good b{color:var(--ok)}
.ch{background:var(--p2);border:1px solid var(--bd);border-radius:7px;position:relative;min-width:0}
.ch canvas{position:absolute;inset:0;width:100%;height:100%}
.audit{display:grid;grid-template-columns:1.6fr 1fr;gap:12px;height:100%}
.audit>div{overflow:auto;min-height:0}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:3px 7px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu);font-weight:500;font-size:11px;position:sticky;top:0;background:var(--p);cursor:help}
th:first-child,td:first-child{text-align:left}
td.z{color:#55627a}td.b{color:var(--er);font-weight:600}td.w{color:var(--wa);font-weight:600}td.g{color:var(--ok)}
.an{display:flex;gap:6px;padding:3px 6px;border-radius:5px;cursor:pointer;align-items:center}
.an:hover,.an.on{background:var(--p2)}
.tl{font-size:12px;border-left:2px solid var(--bd);margin:6px 0 6px 6px;padding-left:9px}
.tl div{margin:1px 0}.tl .t{color:var(--mu);display:inline-block;width:62px}
.tl .x{color:var(--er)}.tl .y{color:var(--ok)}.tl .o{color:var(--wa)}
.logl{overflow:auto;height:100%;font-family:ui-monospace,Consolas,monospace;font-size:12px}
.logl div{padding:1px 0}.logl .t{color:var(--mu);margin-right:8px}
.logl .fault{color:var(--wa)}.logl .crash,.logl .err{color:var(--er)}.logl .ok{color:var(--ok)}.logl .warn{color:#e3b341}
.trade{display:grid;grid-template-columns:380px 1fr;gap:14px;height:100%}.trade>div{overflow:auto;min-height:0}
.li{display:flex;gap:8px;padding:5px 7px;border-radius:6px;cursor:pointer;align-items:flex-start}
.li:hover{background:var(--p2)}.li .lv{flex:none;width:52px;text-align:center;font-size:10px;border-radius:9px;padding:1px 0;margin-top:2px;font-weight:600}
.lv.risk{background:#4a1d1d;color:#ff8f88}.lv.warn{background:#463610;color:#e3b341}.lv.good{background:#12381b;color:#56d364}.lv.info{background:#1b2c44;color:#79b8ff}
.li b{display:block}.li span{color:#aab6c5;font-size:12px}
#modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:20}
#modal[hidden]{display:none}
.mb{background:var(--p);border:1px solid var(--bd);border-radius:12px;width:min(1020px,94vw);max-height:90vh;overflow:auto;padding:18px 22px}
.mb h2{margin:0 0 4px;font-size:19px}.mb h2 button{float:right}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px;margin-top:10px}
.card{border:1px solid var(--bd);border-radius:9px;padding:10px 12px;background:var(--p2);cursor:pointer;display:flex;flex-direction:column;gap:4px}
.card:hover{border-color:var(--ac)}.card b{font-size:13.5px}.card span{color:#aab6c5;font-size:12px}
.card em{font-style:normal;color:var(--wa);font-size:11px}
.saved{display:flex;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid var(--bd)}.saved span{flex:1}
#toast{position:fixed;left:50%;bottom:300px;transform:translateX(-50%);background:#1f2937;border:1px solid var(--bd);padding:7px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:70vw}
#toast.on{opacity:1}
.help li{margin:4px 0}.help kbd{background:var(--p3);border:1px solid var(--bd);border-radius:4px;padding:0 5px;font-size:11px}
</style>
</head>
<body>
<header id="top">
  <div class="brand">◢ Faultline<small>system design failure lab</small></div>
  <button id="bLib" title="Example library and saved systems">📚 Library</button>
  <button id="bNew" title="Start an empty system">New</button>
  <button id="bSave" title="Save this system (and its failure scenarios) in this browser">Save</button>
  <button id="bExp" title="Download as JSON">Export</button>
  <button id="bImp" title="Load a JSON file">Import</button>
  <input id="sysName" title="System name" spellcheck="false">
  <span class="sep"></span>
  <button id="bRun" class="pri">▶ Run</button>
  <button id="bStep" title="Advance 50 ms of simulated time">Step</button>
  <button id="bReset" title="Restart the simulation and clear all statistics">↺ Reset</button>
  <button id="bManual" title="Hold every source so nothing is sent automatically. Then send messages one at a time with the ▶1 button on a source. (▶1 also works while the clock is paused: the clock runs in slow motion until that one message has settled, then pauses again.)">✋ Hold sources</button>
  <select id="speed" title="Simulation speed">
    <option value="0.05">0.05×</option><option value="0.1">0.1×</option><option value="0.25">0.25×</option><option value="0.5">0.5×</option>
    <option value="1" selected>1×</option><option value="2">2×</option><option value="5">5×</option><option value="10">10×</option>
  </select>
  <div class="seg" id="viewSeg" title="Messages: every request is a moving dot (best at low rates / slow motion). Flow: edges show aggregate rate and failure share (best at high rates).">
    <button data-v="messages" class="on">Messages</button><button data-v="flow">Flow</button>
  </div>
  <span class="sep"></span>
  <button id="bHeal" title="Clear every injected fault and watch the system recover">✚ Heal all</button>
  <span id="clock">t = 0.0 s</span>
  <button id="bHelp">?</button>
</header>
<main id="main">
  <aside id="palette"></aside>
  <section id="stage">
    <svg id="svg">
      <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
      <g id="vp"><g id="groups"></g><g id="edges"></g><g id="nodes"></g><path id="tmp" style="display:none"/></g>
    </svg>
    <canvas id="fx"></canvas>
    <div id="lag">⚠ simulation is running slower than requested (very high event rate)</div>
    <div id="hint">Drag from a node's ● to connect · ▶1 on a source sends a single message · drag a group by its title bar · scroll to zoom · Del removes selection · Space runs/pauses</div>
  </section>
  <aside id="insp"></aside>
</main>
<footer id="dock"><nav id="tabs"></nav><div id="dockbody"></div></footer>
<div id="modal" hidden></div>
<div id="toast"></div>
<input type="file" id="file" accept=".json,application/json" hidden>
<script id="engine">
'use strict';
/* ============================================================
   ENGINE — discrete-event simulator. No DOM access in this block.
   ============================================================ */
const clone=o=>JSON.parse(JSON.stringify(o));
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

class Heap{constructor(){this.a=[]}
 push(e){const a=this.a;let i=a.length;a.push(e);while(i>0){const p=(i-1)>>1,q=a[p];if(q.t<e.t||(q.t===e.t&&q.n<e.n))break;a[i]=q;i=p}a[i]=e}
 pop(){const a=this.a,top=a[0],e=a.pop(),n=a.length;if(n){let i=0;for(;;){let c=2*i+1;if(c>=n)break;if(c+1<n&&(a[c+1].t<a[c].t||(a[c+1].t===a[c].t&&a[c+1].n<a[c].n)))c++;const q=a[c];if(e.t<q.t||(e.t===q.t&&e.n<q.n))break;a[i]=q;i=c}a[i]=e}return top}}
class Dq{constructor(){this.a=[];this.h=0}
 get length(){return this.a.length-this.h}
 push(x){this.a.push(x)}
 peek(){return this.a[this.h]}
 shift(){const x=this.a[this.h];this.a[this.h++]=undefined;if(this.h>512&&this.h*2>this.a.length){this.a=this.a.slice(this.h);this.h=0}return x}
 unshift(x){if(this.h>0)this.a[--this.h]=x;else this.a.unshift(x)}
 clear(){this.a=[];this.h=0}
 *[Symbol.iterator](){for(let i=this.h;i<this.a.length;i++)yield this.a[i]}}

const TYPES={
 client:{kind:'producer',label:'API Client',group:'Sources',icon:'👤',desc:'Calls an API at a rate and waits for the response.'},
 source:{kind:'producer',label:'Event Source',group:'Sources',icon:'📡',desc:'Emits events (devices, upstream systems, CDC).',d:{timeout:1000,retries:2}},
 cron:{kind:'producer',label:'Scheduler / Cron',group:'Sources',icon:'⏱',desc:'Releases a batch of messages on a schedule (a nightly job), or ticks at a steady rate.',d:{mode:'schedule',everyS:15,release:'200',rateMin:1,rateMax:1,spacing:'even'}},
 service:{kind:'service',label:'Service',group:'Compute',icon:'⚙',desc:'Handles requests or events and performs ordered actions.'},
 worker:{kind:'service',label:'Worker / Consumer',group:'Compute',icon:'🛠',desc:'Background consumer of a topic or queue.',d:{concurrency:4}},
 fn:{kind:'service',label:'Serverless Function',group:'Compute',icon:'λ',desc:'High concurrency, small buffer.',d:{concurrency:100,procMs:40,queueCap:10}},
 lb:{kind:'proxy',label:'Load Balancer',group:'Traffic',icon:'⚖',desc:'Spreads calls across its targets.'},
 gateway:{kind:'proxy',label:'API Gateway',group:'Traffic',icon:'🚪',desc:'Single entry point; optional rate limit.',d:{latency:3}},
 limiter:{kind:'proxy',label:'Rate Limiter',group:'Traffic',icon:'🚦',desc:'Rejects traffic above a rate (429).',d:{rateLimit:50}},
 cdn:{kind:'proxy',label:'CDN / Edge Cache',group:'Traffic',icon:'🌐',desc:'Answers a share of read requests at the edge.',d:{hitRatio:80,latency:5}},
 kafka:{kind:'log',label:'Kafka Topic',group:'Messaging',icon:'📜',desc:'Durable partitioned log; each subscriber is a consumer group.'},
 stream:{kind:'log',label:'Event Stream',group:'Messaging',icon:'🌊',desc:'Kinesis-style stream with a throughput limit.',d:{partitions:2,rateLimit:1000,retention:2000}},
 queue:{kind:'queue',label:'Queue (SQS/Rabbit)',group:'Messaging',icon:'📥',desc:'Competing consumers, per-message retry, DLQ.'},
 fifo:{kind:'queue',label:'FIFO Queue',group:'Messaging',icon:'🧾',desc:'Strictly ordered queue: one message in flight.',d:{fifo:true}},
 pubsub:{kind:'pubsub',label:'Pub/Sub (SNS)',group:'Messaging',icon:'📣',desc:'Push fan-out with no retention.'},
 sql:{kind:'store',label:'SQL Database',group:'Storage',icon:'🗄',desc:'Transactions, limited connection pool.'},
 nosql:{kind:'store',label:'NoSQL / KV Store',group:'Storage',icon:'🧱',desc:'Fast upserts, no multi-write transactions.',d:{supportsTx:false,latency:3,maxConc:100,idempotent:true}},
 replica:{kind:'store',label:'Read Replica',group:'Storage',icon:'🪞',desc:'Lags the primary: reads can be stale.',d:{replicaLag:500}},
 cache:{kind:'cache',label:'Cache (Redis)',group:'Storage',icon:'⚡',desc:'TTL cache; connect it to a database for read-through.'},
 blob:{kind:'store',label:'Object Storage',group:'Storage',icon:'🪣',desc:'Slow, huge capacity, idempotent puts.',d:{latency:40,maxConc:200,supportsTx:false,idempotent:true}},
 search:{kind:'store',label:'Search Index',group:'Storage',icon:'🔎',desc:'Secondary index fed by writes or events.',d:{latency:15,supportsTx:false,idempotent:true}},
 ext:{kind:'external',label:'Third-party API',group:'External',icon:'🌍',desc:'A dependency you do not control.'},
 payment:{kind:'external',label:'Payment Provider',group:'External',icon:'💳',desc:'Non-idempotent by default: a retry can charge twice.',d:{latency:200}},
 email:{kind:'external',label:'Email / SMS Provider',group:'External',icon:'✉',desc:'Rate-limited notification provider.',d:{latency:120,rateLimit:100}},
 note:{kind:'note',label:'Text label',group:'Other',icon:'🏷',desc:'Annotation on the canvas.'}
};

function KIND(n){const t=n&&TYPES[n.type];return t?t.kind:'note'}
function newModel(name){return{name:name||'Untitled system',desc:'',nodes:[],edges:[],groups:[],scenarios:[],seq:1,rev:0,seed:Math.floor(Math.random()*1e9)}}
function addNode(m,type,x,y,name,cfg){const T=TYPES[type],k=T.kind;
 if(!name){const base=k==='note'?'Label':T.label.split(/[ /(]/)[0].toLowerCase();let i=1;while(m.nodes.some(n=>n.name===base+'-'+i))i++;name=k==='note'?'Label':base+'-'+i}
 const n={id:'n'+(m.seq++),type,name,x:Math.round(x),y:Math.round(y),cfg:Object.assign(clone(KDEF[k]),T.d||{},cfg||{}),fault:clone(FDEF[k])};
 m.nodes.push(n);m.rev=(m.rev|0)+1;return n}
function canConnect(m,a,b){const ka=KIND(a),kb=KIND(b);
 if(a===b)return'A node cannot be connected to itself';

 if(kb==='producer')return'Sources only emit — nothing can call them';
 if(ka==='store'||ka==='external')return a.name+' only responds — it cannot initiate calls';
 if(ka==='cache'){if(kb!=='store')return'A cache can only read through to a database';if(m.edges.some(e=>e.from===a.id))return'This cache already has a backing store'}

 if(ka==='log'||ka==='queue')e.cfg.sub=Object.assign(clone(SUBD),o.sub||{});

 if(ka==='service')a.cfg.actions.push(Object.assign({id:'a'+(m.seq++),edge:e.id},clone(ACTD),kb==='cache'?{op:'read'}:{},o.act||{}));
 m.rev=(m.rev|0)+1;return e}
function removeEdge(m,id){m.edges=m.edges.filter(e=>e.id!==id);for(const n of m.nodes)if(n.cfg.actions)n.cfg.actions=n.cfg.actions.filter(a=>a.edge!==id);m.rev=(m.rev|0)+1}
function removeNode(m,id){for(const e of m.edges.filter(e=>e.from===id||e.to===id))removeEdge(m,e.id);m.nodes=m.nodes.filter(n=>n.id!==id);m.rev=(m.rev|0)+1}

 const g={id:'g'+(m.seq++),name,x:Math.round(x),y:Math.round(y),w:Math.round(w||260),h:Math.round(h||150),cfg:Object.assign(clone(GDEF),cfg||{}),fault:clone(GFDEF)};
 m.groups.push(g);regroup(m);m.rev=(m.rev|0)+1;return g}
function removeGroup(m,id){m.groups=m.groups.filter(g=>g.id!==id);regroup(m);m.rev=(m.rev|0)+1}
/* membership is geometric: a node belongs to the smallest group that contains its centre */
function regroup(m){let ch=false;for(const n of m.nodes){let best=null,ba=Infinity;
  if(KIND(n)!=='note'){const cx=n.x+NODE_W/2,cy=n.y+NODE_H/2;for(const g of m.groups||[])if(cx>=g.x&&cx<=g.x+g.w&&cy>=g.y&&cy<=g.y+g.h&&g.w*g.h<ba){best=g.id;ba=g.w*g.h}}
  if((n.group||null)!==best){ch=true;if(best)n.group=best;else delete n.group}}
 if(ch)m.rev=(m.rev|0)+1;return ch}
function normalize(m){m.nodes=(m.nodes||[]).filter(n=>TYPES[n.type]);m.edges=m.edges||[];m.groups=m.groups||[];m.scenarios=m.scenarios||[];m.desc=m.desc||'';m.rev=0;let mx=0;
 const bump=id=>{const v=parseInt(String(id).slice(1),10);if(v>mx)mx=v};
 for(const g of m.groups){bump(g.id);g.cfg=Object.assign(clone(GDEF),g.cfg||{});g.fault=Object.assign(clone(GFDEF),g.fault||{})}
 for(const n of m.nodes){const k=KIND(n);bump(n.id);if(n.type==='cron'&&n.cfg&&n.cfg.mode===undefined&&n.cfg.rateMin!==undefined)n.cfg.mode='rate';n.cfg=Object.assign(clone(KDEF[k]),TYPES[n.type].d||{},n.cfg||{});n.fault=Object.assign(clone(FDEF[k]),n.fault||{});
  if(k==='service')n.cfg.actions=(n.cfg.actions||[]).map(a=>{bump(a.id);return Object.assign(clone(ACTD),a)})}
 const ids=new Set(m.nodes.map(n=>n.id));m.edges=m.edges.filter(e=>ids.has(e.from)&&ids.has(e.to));
 for(const e of m.edges){bump(e.id);e.cfg=Object.assign({latency:2},e.cfg||{});e.fault=Object.assign(clone(EFDEF),e.fault||{});
  const ka=KIND(m.nodes.find(n=>n.id===e.from));if(ka==='log'||ka==='queue')e.cfg.sub=Object.assign(clone(SUBD),e.cfg.sub||{})}
 m.seq=Math.max(m.seq|0,mx+1);if(!m.seed)m.seed=12345;regroup(m);m.rev=0;return m}

const AFLAGS=['lost','duplicate','partial','ghost','corrupt','ooo','stale','parked'];
function newAuditRow(){return{created:0,done:0,ok:0,fail:0,clean:0,cleanFail:0,rejected:0,anom:0,degraded:0,lost:0,duplicate:0,partial:0,ghost:0,corrupt:0,ooo:0,stale:0,parked:0}}

class Sim{
 constructor(model,hooks){this.m=model;this.hk=hooks||{};this.t=0;this.n=0;this.heap=new Heap();this.rts=new Map();this.ess=new Map();
  this.rand=mulberry32(model.seed||12345);this.idx=null;this.idxRev=-1;this.lastWrite=new Map();this.trN=0;this.neg=0;this.lagging=false;this.grts=new Map();this.manual=false;this.coTok=0;
  this.A=Object.assign(newAuditRow(),{dedup:0,by:{},recent:[]});
  this.G={ok:0,err:0,retries:0,timeouts:0,lat:[],hist:[],snap:[]};
  this.logs=[];this.marks=[];
  this.at(0,()=>this.ensureProducers());this.at(500,()=>this.tick())}
 at(d,fn){this.heap.push({t:this.t+(d>0?d:0),n:this.n++,fn})}
 advance(dt){const end=this.t+dt,h=this.heap;let c=0;
  while(h.a.length&&h.a[0].t<=end){const ev=h.pop();this.t=ev.t;ev.fn();if(++c>200000){this.lagging=true;return}}
  this.lagging=false;this.t=end}
 ix(){const m=this.m;if(this.idxRev!==m.rev||!this.idx){const nm=new Map(),em=new Map(),out=new Map();
   for(const n of m.nodes){nm.set(n.id,n);out.set(n.id,[])}
   for(const e of m.edges){if(!nm.has(e.from)||!nm.has(e.to))continue;em.set(e.id,e);out.get(e.from).push(e)}
   const gm=new Map();for(const g of m.groups||[])gm.set(g.id,g);
   this.idx={nm,em,out,gm};this.idxRev=m.rev}return this.idx}
 node(id){return this.ix().nm.get(id)}
 edge(id){return this.ix().em.get(id)}
 outs(id){return this.ix().out.get(id)||[]}
 chance(p){return p>0&&this.rand()*100<p}
 jit(base,j){const v=base*(1+j*(this.rand()*2-1));return v>0?v:0}
 log(level,msg){this.logs.push({t:this.t,level,msg});if(this.logs.length>400)this.logs.shift()}
 mark(label){this.marks.push({t:this.t,label});if(this.marks.length>40)this.marks.shift()}
 vis(eid,k){const v=this.hk.vis;if(v)v(eid,k)}
 tlog(tr,code,nid,x){if(tr.ev.length<40)tr.ev.push([this.t,code,nid,x])}
 lat(r,v){if(r.lat.length<300)r.lat.push(v)}
 rt(n){let r=this.rts.get(n.id);if(r)return r;const k=KIND(n);
  r={c:{in:0,ok:0,err:0},snap:[],rate:{in:0,ok:0,err:0},lat:[],p50:0,p99:0,hist:[],busy:0,q:new Dq(),tok:null,tokT:0,rr:0};
  if(k==='service')Object.assign(r,{epoch:0,downUntil:0,inflight:new Set(),outbox:new Dq(),relaying:false,obT:false,obEp:0,inbox:new Dq(),ibFly:0,ibT:false,brk:{},lastSeq:new Map(),once:0,actOnce:{},wasDown:false});
  else if(k==='log'){r.parts=[];for(let i=0;i<Math.max(1,n.cfg.partitions|0);i++)r.parts.push({log:[],base:0,h:0});r.groups=new Map();r.ks={}}
  else if(k==='queue'){r.ready=new Dq();r.infl=0;r.win={};r.ks={}}
  else if(k==='cache')r.map=new Map();
  else if(k==='proxy'){r.hl={};r.out={}}
  else if(k==='producer'){r.seq={};r.started=false;r.cur=0;r.nextRe=0;r.last=null;r.fireN=0;r.lastCount=0}
  this.rts.set(n.id,r);return r}
 est(e){let s=this.ess.get(e.id);if(!s){s={sent:0,fail:0,drop:0,dup:0,snap:[],rate:0,frate:0};this.ess.set(e.id,s)}return s}
 bucket(r,rate){const cap=Math.max(1,rate*0.5);if(r.tok===null){r.tok=cap;r.tokT=this.t}
  r.tok=Math.min(cap,r.tok+(this.t-r.tokT)*rate/1000);r.tokT=this.t;if(r.tok<1)return false;r.tok-=1;return true}
 isUp(n){if(this.off(n))return false;const r=this.rts.get(n.id);return!(r&&r.downUntil>this.t)}

 /* ---------- app groups: instances, deployment state, shared faults ---------- */
 grp(n){return n.group?this.ix().gm.get(n.group):undefined}
 grt(g){let r=this.grts.get(g.id);if(!r){r={inst:Math.min(g.fault.instDown|0,this.gN(g)),detectUntil:0,deadPct:0,startUntil:0,wasStopped:this.gStopped(g),wasOff:false};this.grts.set(g.id,r)}return r}
 gN(g){return Math.max(1,g.cfg.instances|0)}
 gLive(g){return Math.max(0,this.gN(g)-(g.fault.instDown|0))}
 gStopped(g){const f=g.fault;return f.stopped==null?!!g.cfg.stopped:!!f.stopped}
 gOff(g){return!!g.fault.down||this.gStopped(g)||this.gLive(g)<=0||this.grt(g).startUntil>this.t}
 gW(g){if(this.gStopped(g)||this.grt(g).startUntil>this.t)return 0;const w=g.fault.weight==null?g.cfg.weight:g.fault.weight;return w>0?+w:0}
 off(n){if(n.fault['down'])return true;if(!n.group)return false;const g=this.ix().gm.get(n.group);return!!g&&this.gOff(g)}
 er(n){const a=n.fault.errorRate||0;if(!n.group)return a;const g=this.ix().gm.get(n.group),b=g?g.fault.errorRate||0:0;return b?100*(1-(1-a/100)*(1-b/100)):a}
 lm(n){const a=n.fault.latencyMult||1;if(!n.group)return a;const g=this.ix().gm.get(n.group);return g?a*(g.fault.latencyMult||1):a}
 wt(n){const g=n&&this.grp(n);return g?this.gW(g):100}
 cut(e){const a=this.node(e.from),b=this.node(e.to);if(!a||!b||a.group===b.group)return false;const ga=this.grp(a),gb=this.grp(b);return!!((ga&&ga.fault.partition)||(gb&&gb.fault.partition))}
 pickW(outs,u){let tot=0;const ws=outs.map(o=>{const w=this.wt(this.node(o.to));tot+=w;return w});let x=u*tot;for(let i=0;i<outs.length;i++){x-=ws[i];if(x<0)return outs[i]}return outs[outs.length-1]}
 uneven(outs){const w0=this.wt(this.node(outs[0].to));for(let i=1;i<outs.length;i++)if(this.wt(this.node(outs[i].to))!==w0)return true;return false}
 members(g,kind){return this.m.nodes.filter(n=>n.group===g.id&&(!kind||KIND(n)===kind))}
 gl(g){return g.name+(g.cfg.version?" "+g.cfg.version:"")}
 syncGroups2(){for(const g of this.m.groups||[]){const gr=this.grt(g),N=this.gN(g),k=Math.min(Math.max(0,g.fault.instDown|0),N);
   if(k>gr.inst){const frac=(k-gr.inst)/Math.max(1,N-gr.inst);if(k<N)for(const n of this.members(g,'service'))this.crashPart(n,frac);
    gr.detectUntil=this.t+(g.cfg.detectMs||0);gr.deadPct=100*k/N;this.log('crash',this.gl(g)+': '+(k-gr.inst)+' instance(s) died — '+(N-k)+' of '+N+' left'+(k<N&&g.cfg.detectMs>0?'; requests still routed to the dead one fail for '+g.cfg.detectMs+' ms':''))}
   else if(k<gr.inst)this.log('ok',this.gl(g)+': instance(s) back — '+(N-k)+' of '+N+' running');
   gr.inst=k;
   const st=this.gStopped(g);if(st!==gr.wasStopped){gr.wasStopped=st;if(st)this.log('fault',this.gl(g)+' stopped');else{gr.startUntil=this.t+(g.cfg.startMs||0);this.log('fault',this.gl(g)+' starting (ready in '+(g.cfg.startMs||0)+' ms)')}}
   const off=this.gOff(g);if(off!==gr.wasOff){gr.wasOff=off;if(!off)this.log('ok',this.gl(g)+' is up and serving')}}}
 crashPart(n,frac){const r=this.rt(n);let c=0;
  const kill=j=>{c++;j.dead=true;const tr=j.msg.tr;if(j.acked){this.lose(tr,'accepted work lost when an instance died',n.id);tr.pending--;this.check(tr)}else j.reply.abandon()};
  for(const j of [...r.inflight])if(this.rand()<frac){r.inflight.delete(j);r.busy--;kill(j)}
  if(r.q.length){const keep=[];for(const j of r.q){if(this.rand()<frac)kill(j);else keep.push(j)}r.q=new Dq();for(const j of keep)r.q.push(j)}
  r.c.crash=(r.c.crash|0)+1;return c}
 killOne(g){g.fault.instDown=Math.min(this.gN(g),(g.fault.instDown|0)+1);this.syncFaults()}
 rolling(g){const N=this.gN(g),id=g.id;let i=0;this.log('fault',this.gl(g)+': rolling restart of '+N+' instance(s), one at a time');
  const nxt=()=>{if(this.ix().gm.get(id)!==g)return;if(i++>=N)return this.log('ok',this.gl(g)+': rolling restart finished');
   g.fault.instDown=Math.min(N,(g.fault.instDown|0)+1);this.syncFaults();
   this.at((g.cfg.startMs||0)+10,()=>{g.fault.instDown=Math.max(0,(g.fault.instDown|0)-1);this.syncFaults();this.at(400,nxt)})};nxt()}
 cancelCutover(){this.coTok++}
 /* deployment cut-over from one app group to another */
 cutover(toId,fromId,mode){const G=id=>this.ix().gm.get(id),to=G(toId),from=G(fromId);if(!to||!from||to===from)return;const tok=++this.coTok;
  const live=()=>tok===this.coTok&&G(toId)===to&&G(fromId)===from,say=(lvl,m)=>{this.log(lvl,m);this.mark(m.split(':')[0])};
  const ready=cb=>{if(this.gStopped(to)){to.fault.stopped=false;to.fault.weight=0;this.syncFaults();this.at((to.cfg.startMs||0)+20,()=>{if(live())cb()})}else cb()};
  if(mode==='rollback'){for(const g of [to,from]){g.fault.weight=null;g.fault.stopped=null}say('ok','Rollback: '+this.gl(to)+' and '+this.gl(from)+' are back to their baseline traffic split');return this.syncFaults()}
  if(mode==='bluegreen')ready(()=>{to.fault.weight=100;from.fault.weight=0;say('fault','Blue/green: all traffic switched '+this.gl(from)+' → '+this.gl(to)+' at once ('+this.gl(from)+' stays up for instant rollback)');this.syncFaults()});
  else if(mode==='ab')ready(()=>{to.fault.weight=50;from.fault.weight=50;say('fault','A/B: traffic split 50/50 between '+this.gl(from)+' and '+this.gl(to)+' (use "Sticky by key" balancing to pin each user to one side)');this.syncFaults()});
  else if(mode==='highlander'){from.fault.stopped=true;from.fault.weight=0;to.fault.weight=100;to.fault.stopped=true;this.syncFaults();
   say('fault','Highlander: '+this.gl(from)+' stopped first; '+this.gl(to)+' starts now — nothing serves for '+(to.cfg.startMs||0)+' ms');
   to.fault.stopped=false;this.syncFaults()}
  else if(mode==='canary'){const steps=String(to.cfg.canarySteps||'5,25,50,100').split(/[\s,;]+/).map(Number).filter(x=>x>0&&x<=100),stepMs=Math.max(0.5,+to.cfg.canaryStepS||6)*1000,thr=+to.cfg.canaryRollback||0;

   const stats=()=>{let a=0,b=0;for(const n of this.members(to,'service')){const c=this.rt(n).c;a+=c.in;b+=c.err}return[a,b]};
   const step=()=>{if(!live())return;
    if(i>0){const s=stats(),din=s[0]-snap[0],de=s[1]-snap[1];
     if(thr>0&&din>=5&&de/din*100>thr){to.fault.weight=0;from.fault.weight=100;this.syncFaults();return say('warn','Canary ROLLED BACK: '+this.gl(to)+' failed '+Math.round(de/din*100)+'% of its requests (limit '+thr+'%) — all traffic back on '+this.gl(from))}}
    if(i>=steps.length)return say('ok','Canary complete: '+this.gl(to)+' now takes 100%');
    const w=steps[i++];to.fault.weight=w;from.fault.weight=100-w;snap=stats();say('fault','Canary '+w+'%: '+this.gl(to)+' now receives '+w+'% of traffic');this.syncFaults();this.at(stepMs,step)};
   ready(step)}}

 /* ---------- audit ---------- */
 lose(tr,why,nid){if(!tr.lost)tr.lost=why;this.tlog(tr,'lost',nid,why)}
 check(tr){if(tr.pending<0){this.neg++;tr.pending=0}if(tr.pending===0&&tr.clientDone&&!tr.final)this.finalize(tr)}
 by(src){return this.A.by[src]||(this.A.by[src]=newAuditRow())}
 finalize(tr){tr.final=true;tr.tEnd=this.t;const A=this.A,B=this.by(tr.src),flags=[];let dup=tr.dupK||null,any=false;
  for(const k in tr.fx)if(tr.fx[k]>0)any=true;
  let partial=null;
  for(const sid in tr.sv){const s=this.node(sid);if(!s||!s.cfg.actions)continue;let tot=0,ap=0;
   for(const a of s.cfg.actions){if(a.op==='read'||!this.edge(a.edge))continue;
    if(a.onError==='continue'||a.await===false||a.when==='fallback')continue;tot++;if(tr.fx[sid+':'+a.id]>0)ap++}
   if(ap>0&&ap<tot)partial=sid}
  const deg=!!tr.deg&&!partial;
  if(tr.ok&&tr.lost)flags.push('lost');
  if(dup)flags.push('duplicate');
  if(partial)flags.push('partial');
  if(!tr.ok&&any)flags.push('ghost');
  if(tr.corrupt)flags.push('corrupt');if(tr.ooo)flags.push('ooo');if(tr.stale)flags.push('stale');if(tr.parked)flags.push('parked');
  for(const X of [A,B]){X.done++;if(tr.ok)X.ok++;else X.fail++;for(const f of flags)X[f]++;
   if(deg)X.degraded++;
   if(!flags.length){if(tr.ok)X.clean++;else if(tr.rejected)X.rejected++;else X.cleanFail++}else X.anom++}
  if(flags.length){tr.flags=flags;tr.dupKey=dup;tr.partialAt=partial;A.recent.push(tr);if(A.recent.length>150)A.recent.shift()}}

 /* ---------- transport ---------- */
 send(e,msg,cb){const tr=msg.tr,f=e.fault,c=e.cfg,s=this.est(e);s.sent++;tr.pending++;
  let replied=false;const once=res=>{if(replied)return;replied=true;if(!res.ok)s.fail++;cb(res)};

   if(!g){g={key,es:[],off:r.parts.map(P=>P.base+P.log.length),busy:r.parts.map(()=>0),epoch:0,dlq:0,dead:false};r.groups.set(key,g)}g.es.push(e)}

  if(stale)for(const [id,g] of [...r.groups])if(!g.es.length){this.dropGroup(r,g);r.groups.delete(id)}}
 gPick(g,p,np){let el=null;for(const e of g.es){const c=this.node(e.to);if(c&&this.edge(e.id)&&this.isUp(c)&&this.wt(c)>0)(el||(el=[])).push(e)}
  if(!el)return null;return el.length===1?el[0]:this.pickW(el,(p+0.5)/np)}

 lag(r){let mx=0,dlq=0;for(const g of r.groups.values()){let l=0;for(let p=0;p<r.parts.length;p++){const P=r.parts[p];l+=P.base+P.log.length-g.off[p]}if(l>mx)mx=l;dlq+=g.dlq}return{lag:mx,dlq}}
 trim(r,p){const P=r.parts[p];let mn=P.base+P.log.length;for(const g of r.groups.values())if(g.off[p]<mn)mn=g.off[p];
  while(P.base+P.h<mn)P.log[P.h++]=undefined;
  if(P.h>512){P.log=P.log.slice(P.h);P.base+=P.h;P.h=0}}

  while(P.log.length-P.h>max){const off=P.base+P.h,ent=P.log[P.h];let stuck=false;
   for(const g of r.groups.values())if(g.off[p]===off&&g.busy[p]){stuck=true;break}
   if(stuck)break;
   for(const g of r.groups.values())if(g.off[p]<=off){g.off[p]=off+1;r.c.expired=(r.c.expired|0)+1;this.lose(ent.tr,'retention: expired before it was consumed',n.id);ent.tr.pending--;this.check(ent.tr)}
   P.log[P.h++]=undefined}}
 pumpLog(n,r){if(this.off(n)||n.fault.pause)return;
  for(const g of r.groups.values()){if(g.dead)continue;
   for(let p=0;p<r.parts.length;p++){if(g.busy[p])continue;const P=r.parts[p];if(g.off[p]>=P.base+P.log.length)continue;
    const ent=P.log[g.off[p]-P.base];if(!ent){g.off[p]++;p--;continue}
    const tk=g.busy[p]=++this.n;this.logDeliver(n,r,g,p,ent,g.off[p],1,tk)}}}
 logDeliver(n,r,g,p,ent,off,k,tk){const ep=g.epoch,tr=ent.tr;
  const again=(kk,d)=>this.at(d,()=>{if(g.epoch!==ep||g.dead||g.busy[p]!==tk)return;this.logDeliver(n,r,g,p,ent,off,kk,tk)});
  const e=this.gPick(g,p,r.parts.length);
  if(!e||this.off(n)||n.fault.pause)return again(k,250);
  const sub=e.cfg.sub||SUBD,before=sub.ack==='before';

  const complete=()=>{if(g.busy[p]!==tk)return;if(!before&&g.off[p]===off)g.off[p]=off+1;g.busy[p]=0;tr.pending--;this.check(tr);this.trim(r,p);this.pumpLog(n,r)};

   if(g.epoch!==ep||g.dead){if(before&&!g.dead){tr.pending--;this.check(tr)}return}
   if(res.ok)return complete();
   const free=res.err==='down'||res.err==='overload'||res.err==='throttled';
   if(!free)r.c.redeliv=(r.c.redeliv|0)+1;
   if(before){if(free){g.off[p]=off;return again(k,250)}this.lose(tr,'at-most-once: failed after the offset was committed',e.to);return complete()}
   const block=sub.onExhaust==='block';

   if(block||(res.retry!==false&&k<sub.maxAttempts)){this.tlog(tr,'redeliver',e.to,res.err);return again(k+1,sub.backoff*(block?1:k))}

 rebalance(n){const r=this.rt(n);if(!r.groups)return;this.log('fault',n.name+': consumer-group rebalance (in-flight messages will be redelivered)');
  const snap=[];for(const g of r.groups.values()){g.epoch++;snap.push([g,g.busy.slice()])}
  this.at(2000,()=>{for(const [g,b] of snap)for(let p=0;p<b.length;p++)if(b[p]&&g.busy[p]===b[p])g.busy[p]=0;this.pumpLog(n,r)})}

 /* ---------- queue (SQS / RabbitMQ-style) ---------- */
 queueWork(n,r,msg,e){const key=msg.act||('e:'+e.id),tr=msg.tr;
  if(r.ready.length+r.infl>=(n.cfg.capacity||1e9)){r.c.rej=(r.c.rej|0)+1;return{ok:false,err:'overload',retry:true}}
  if(!this.effect(n,r,msg,key))return{ok:true};
  r.ready.push({tr,key:msg.key,seq:(r.ks[msg.key]=(r.ks[msg.key]|0)+1),bad:msg.bad,n:0});tr.pending++;this.pumpQ(n,r);return{ok:true}}
 pumpQ(n,r){if(this.off(n)||n.fault.pause)return;const outs=this.outs(n.id);if(!outs.length)return;const fifo=n.cfg.fifo;
  while(r.ready.length){if(fifo&&r.infl>0)return;let el=null;
   for(const e of outs){const sub=e.cfg.sub||SUBD,c=this.node(e.to);if((r.win[e.id]|0)>=(fifo?1:(sub.prefetch||10))||!c||!this.isUp(c)||this.wt(c)<=0)continue;(el||(el=[])).push(e)}
   if(!el)return;const e=el.length>1&&this.uneven(el)?this.pickW(el,this.rand()):el[r.rr++%el.length];
   const ent=r.ready.shift();r.win[e.id]=(r.win[e.id]|0)+1;r.infl++;this.qDeliver(n,r,e,ent)}}

  const rel=()=>{r.win[e.id]--;r.infl--};
  const gone=()=>{rel();tr.pending--;this.check(tr);this.pumpQ(n,r)};
  const fin=res=>{if(done)return;done=true;
   if(res.ok)return gone();
   const free=res.err==='down'||res.err==='overload'||res.err==='throttled';
   if(!free){ent.n++;r.c.redeliv=(r.c.redeliv|0)+1}
   if(sub.ack==='before'&&!free){this.lose(tr,'at-most-once: failed after the message was deleted',e.to);return gone()}
   const block=sub.onExhaust==='block';
   if(free||block||(res.retry!==false&&ent.n<sub.maxAttempts)){
    if(!free)this.tlog(tr,'redeliver',e.to,res.err);
    if(n.cfg.fifo)return this.at(free?250:sub.backoff,()=>{rel();r.ready.unshift(ent);this.pumpQ(n,r)});
    rel();this.at(free?250:sub.backoff,()=>{r.ready.push(ent);this.pumpQ(n,r)});return this.pumpQ(n,r)}
   if(sub.onExhaust==='dlq'){r.c.dlq=(r.c.dlq|0)+1;tr.parked=1;this.tlog(tr,'dlq',e.to)}else this.lose(tr,'dropped after '+ent.n+' failed attempt(s)',e.to);
   gone()};
  this.send(e,{tr,key:ent.key,seq:ent.seq,bad:ent.bad,act:null,op:'write',ord:true},fin);
  this.at(sub.timeout||5000,()=>{if(!done){this.tlog(tr,'ptimeout',e.to);fin({ok:false,err:'timeout',retry:true})}})}

 /* ---------- pub/sub, proxy, cache ---------- */
 pubRecv(n,r,msg,reply,e){this.at(this.jit(n.cfg.latency,0.3),()=>{
  if(this.off(n)||this.chance(this.er(n))){r.c.err++;return reply({ok:false,err:this.off(n)?'down':'error',retry:true})}
  r.c.ok++;const tr=msg.tr;
  if(this.effect(n,r,msg,msg.act||('e:'+e.id)))for(const o of this.outs(n.id))
   this.call(o,{tr,key:msg.key,seq:msg.seq,bad:msg.bad,act:null,op:'write'},{timeout:n.cfg.timeout||2000,retries:n.cfg.retries|0,backoff:200},res=>{
    if(!res.ok&&res.err!=='bad'){r.c.undeliv=(r.c.undeliv|0)+1;this.lose(tr,'pub/sub delivery failed — no retention to retry from',o.to)}});
  reply({ok:true})})}
 proxyRecv(n,r,msg,reply,e){const cfg=n.cfg;
  if(cfg.rateLimit>0&&!this.bucket(r,cfg.rateLimit)){r.c.err++;r.c.thr=(r.c.thr|0)+1;return this.at(1,()=>reply({ok:false,err:'throttled',retry:true}))}
  if(this.chance(this.er(n))){r.c.err++;return this.at(1,()=>reply({ok:false,err:'error',retry:true}))}
  if(cfg.hitRatio>0&&msg.op==='read'&&this.chance(cfg.hitRatio)){r.c.ok++;r.c.hit=(r.c.hit|0)+1;return this.at(this.jit(cfg.latency,0.3),()=>reply({ok:true,cached:true}))}
  const m=msg.act?msg:Object.assign({},msg,{act:'e:'+e.id}),t0=this.t,seen=new Set();let tried=0;
  const go=()=>{const outs=this.outs(n.id).filter(o=>!seen.has(o.id)&&!(cfg.healthEject&&r.hl[o.id]&&r.hl[o.id].until>this.t)&&this.wt(this.node(o.to))>0);
   if(!outs.length){r.c.err++;return reply({ok:false,err:tried?'error':'no-upstream',retry:true})}
   let o;if(cfg.strategy==='sticky')o=this.pickW(outs,(hashStr('s'+msg.key)%9973)/9973);
   else if(outs.length>1&&this.uneven(outs))o=this.pickW(outs,this.rand());
   else if(cfg.strategy==='random')o=outs[Math.floor(this.rand()*outs.length)];
   else if(cfg.strategy==='least'){o=outs[0];for(const x of outs)if((r.out[x.id]|0)<(r.out[o.id]|0))o=x}
   else o=outs[r.rr++%outs.length];
   tried++;seen.add(o.id);r.out[o.id]=(r.out[o.id]|0)+1;
   this.call(o,m,{timeout:cfg.timeout||5000,retries:0,backoff:0},res=>{r.out[o.id]--;
    if(cfg.healthEject){const h=r.hl[o.id]||(r.hl[o.id]={f:0,until:0});if(res.ok||res.err==='bad')h.f=0;
     else if(++h.f>=(cfg.ejectAfter||3)){h.f=0;h.until=this.t+(cfg.ejectMs||5000);const tn=this.node(o.to);this.log('warn',n.name+' ejected '+(tn?tn.name:o.to)+' for '+(cfg.ejectMs||5000)+' ms')}}

    if(res.ok){r.c.ok++;this.lat(r,this.t-t0)}else r.c.err++;reply(res)})};
  this.at(this.jit(cfg.latency,0.3),go)}
 cset(n,r,k){r.map.delete(k);r.map.set(k,{t:this.t,exp:this.t+(n.cfg.ttlMs||0)});if(r.map.size>(n.cfg.capacity||1e9))r.map.delete(r.map.keys().next().value)}

  if(this.off(n)||this.chance(this.er(n))){r.c.err++;return reply({ok:false,err:this.off(n)?'down':'error',retry:true})}

   if(ent&&ent.exp>this.t){r.c.hit=(r.c.hit|0)+1;r.c.ok++;const w=this.lastWrite.get(k);if(w!==undefined&&w>ent.t){r.c.stale=(r.c.stale|0)+1;msg.tr.stale=1}return reply({ok:true,hit:true})}

  r.c.ok++;reply({ok:true})})}

 /* ---------- producers ---------- */
 ensureProducers(){for(const n of this.m.nodes)if(KIND(n)==='producer'){const r=this.rt(n);if(!r.started){r.started=true;this.pLoop(n,r)}}}
 pRate(n,r){const c=n.cfg,f=n.fault;if(f.pause||this.manual||this.off(n))return 0;const lo=Math.min(c.rateMin,c.rateMax),hi=Math.max(c.rateMin,c.rateMax),T=Math.max(1,c.period||20)*1000;let x;

 /* scheduler: "release" is a repeating pattern of batch sizes, one entry per run, e.g. "0,0,0,2000" or "100-300" */
 relCount(n,r){const toks=String(n.cfg.release==null?'1':n.cfg.release).split(/[\s,;]+/).filter(Boolean);if(!toks.length)return 0;
  const m=/^(\d+)(?:-(\d+))?$/.exec(toks[r.fireN++%toks.length]);if(!m)return 0;const a=+m[1],b=m[2]==null?a:+m[2];return Math.round(a+(b-a)*this.rand())}
 fire(n,r,count){count=Math.min(20000,Math.max(0,Math.round(count*(n.fault.surge||1))));const sp=+n.cfg.spreadMs||0;r.c.fires=(r.c.fires|0)+1;r.lastCount=count;
  if(!count)return;this.log('info',n.name+' released a batch of '+count+(sp>0?' spread over '+sp+' ms':' at once'));
  for(let i=0;i<count;i++){if(sp>0)this.at(this.rand()*sp,()=>{if(this.node(n.id)===n)this.emit(n,r)});else this.emit(n,r)}}

 nextFire(n,r){return Math.max(0,(r.last==null?this.t:r.last)+Math.max(0.1,+n.cfg.everyS||10)*1000-this.t)}
 emitOne(n){return this.emit(n,this.rt(n))}
 pLoop(n,r){if(n.cfg.mode==='schedule'){if(r.last==null)r.last=this.t;
   return void this.at(100,()=>{if(this.node(n.id)!==n){r.started=false;return}
    if(n.cfg.mode==='schedule'&&this.nextFire(n,r)<=0){if(n.fault.pause||this.manual||this.off(n))r.last=this.t;else this.fireNow(n)}
    this.pLoop(n,r)})}
  const rate=this.pRate(n,r);let dt=250,emit=false;
  if(rate>0){dt=n.cfg.spacing==='even'?1000/rate:-Math.log(1-this.rand())*1000/rate;emit=true;if(n.cfg.spacing!=='even'&&dt>250){dt=250;emit=false}}
  this.at(dt,()=>{if(this.node(n.id)!==n){r.started=false;return}if(emit&&!n.fault.pause&&!this.manual&&!this.off(n)&&n.cfg.mode!=='schedule')this.emit(n,r);this.pLoop(n,r)})}
 emit(n,r){const c=n.cfg,src=n.id;
  const tr={id:++this.trN,src,t0:this.t,pending:0,fx:{},sv:{},ev:[],calls:0,ok:true,err:null,clientDone:false,final:false,lost:null};
  const ki=Math.floor(this.rand()*Math.max(1,c.keys|0)),key=(c.keyspace||src)+'#'+ki,seq=(r.seq[ki]=(r.seq[ki]|0)+1);
  const msg={tr,key,seq,bad:this.chance(c.badPct)||this.chance(n.fault.badPct),act:null,op:c.op||'write'};
  tr.key=key;tr.bad=msg.bad;this.A.created++;this.by(src).created++;r.c.in++;
  const outs=this.outs(src);
  if(!outs.length){tr.clientDone=true;tr.ok=false;tr.err='no target';r.c.err++;this.finalize(tr);return tr}
  tr.calls=outs.length;const o={timeout:c.timeout,retries:c.retries,backoff:c.backoff};
  for(const e of outs)this.call(e,msg,o,res=>{if(!res.ok){tr.ok=false;tr.err=res.err}
   if(--tr.calls===0){tr.clientDone=true;tr.lat=this.t-tr.t0;
    if(tr.ok){r.c.ok++;this.G.ok++;this.lat(r,tr.lat);if(this.G.lat.length<800)this.G.lat.push(tr.lat)}else{r.c.err++;this.G.err++}}});
  if(this.chance(c.dupPct)){tr.pending++;this.at(5+this.rand()*50,()=>{const e=outs[0];this.tlog(tr,'dblsubmit',e.to);if(this.edge(e.id))this.call(e,msg,o,()=>{});tr.pending--;this.check(tr)})}
  return tr}
 burst(n,count){const r=this.rt(n);for(let i=0;i<count;i++)this.emit(n,r)}

 /* ---------- housekeeping ---------- */
 syncFaults(){this.syncGroups2();for(const n of this.m.nodes){const k=KIND(n),r=this.rt(n);
  if(k==='service'){if(this.off(n)&&!r.wasDown){r.wasDown=true;this.crash(n,true)}else if(!this.off(n)&&r.wasDown){r.wasDown=false;if(!n.group||n.fault['down']===false&&!this.grp(n))this.log('ok',n.name+' is back up')}this.pump(n,r)}
  else if(k==='log'){this.syncGroups(n,r);this.pumpLog(n,r)}
  else if(k==='queue')this.pumpQ(n,r)}}
 forget(n){const r=this.rts.get(n.id);if(!r)return;const k=KIND(n);
  if(k==='service'){this.crash(n,true);for(const o of r.outbox){o.m.tr.pending--;this.check(o.m.tr)}r.outbox.clear();for(const x of r.inbox){x.msg.tr.pending--;this.check(x.msg.tr)}r.inbox.clear()}
  else if(k==='queue'){for(const x of r.ready){x.tr.pending--;this.check(x.tr)}r.ready.clear()}
  else if(k==='log'){for(const g of r.groups.values())this.dropGroup(r,g);r.groups.clear()}}
 tick(){this.ensureProducers();this.syncFaults();
  for(const n of this.m.nodes){const r=this.rt(n),c=r.c,s=r.snap;s.push([c.in,c.ok,c.err]);if(s.length>3)s.shift();
   const a=s[0],dt=(s.length-1)*0.5||0.5;r.rate.in=(c.in-a[0])/dt;r.rate.ok=(c.ok-a[1])/dt;r.rate.err=(c.err-a[2])/dt;
   if(r.lat.length){r.lat.sort((x,y)=>x-y);r.p50=r.lat[r.lat.length>>1];r.p99=r.lat[Math.min(r.lat.length-1,Math.floor(r.lat.length*0.99))];r.lat=[]}
   r.hist.push([r.rate.in,r.rate.ok,r.rate.err]);if(r.hist.length>240)r.hist.shift()}
  for(const e of this.m.edges){const s=this.est(e),q=s.snap;q.push([s.sent,s.fail]);if(q.length>3)q.shift();const a=q[0],dt=(q.length-1)*0.5||0.5;s.rate=(s.sent-a[0])/dt;s.frate=(s.fail-a[1])/dt}

  let p50=null,p99=null;if(G.lat.length){G.lat.sort((x,y)=>x-y);p50=G.lat[G.lat.length>>1];p99=G.lat[Math.min(G.lat.length-1,Math.floor(G.lat.length*0.99))];G.lat=[]}
  G.hist.push({t:this.t,ok:(G.ok-g0[0])/gdt,err:(G.err-g0[1])/gdt,an:(A.anom-g0[2])/gdt,p50,p99,infl:A.created-A.done});if(G.hist.length>600)G.hist.shift();
  this.at(500,()=>this.tick())}
}
if(typeof module!=='undefined')module.exports={Sim,TYPES,KDEF,FDEF,EFDEF,GDEF,GFDEF,SUBD,ACTD,KIND,newModel,addNode,addEdge,removeEdge,removeNode,addGroup,removeGroup,regroup,canConnect,normalize,clone,AFLAGS};

<script id="examples">
'use strict';
/* ============================================================
   STARTER LIBRARY — each example puts two or three designs side by side
   under the same load, with saved failure scenarios to apply.
   ============================================================ */
const EXAMPLES=[];
function ex(name,tag,blurb,desc,fn){EXAMPLES.push({name,tag,blurb,build(){const m=newModel(name);m.desc=desc;m.seed=4242;
 const B={n:(type,nm,x,y,cfg)=>addNode(m,type,x,y,nm,cfg).id,
  e:(a,b,o)=>addEdge(m,a,b,o).id,
  note:(t,x,y)=>addNode(m,'note',x,y,t).id,
  g:(nm,x,y,w,hh,cfg)=>addGroup(m,x,y,w,hh,nm,cfg).id,
  sc:(nm,d,faults,o)=>{m.scenarios.push(Object.assign({id:'s'+(m.seq++),name:nm,desc:d,faults:faults||{},heal:0,triggers:[]},o||{}))}};
 fn(B);regroup(m);return m}})}

ex('Delivery guarantees: at-most-once vs. at-least-once','Messaging','One topic, three consumer groups that acknowledge differently.',

• at-most-once commits the offset BEFORE processing. A crash or error loses the message.
• at-least-once commits AFTER processing. A crash or error redelivers — and the handler may run twice.
• idempotent uses at-least-once plus de-duplication in the consumer and an upsert in the database.

Apply a scenario, then open Consistency audit → "Reconciliation". Each database should hold exactly one row per event:
  db-at-most-once  → fewer unique rows than events (lost)
  db-at-least-once → more total rows than unique (duplicates)
  db-idempotent    → exact

"Exactly-once" is at-least-once delivery plus idempotent processing.`,B=>{

 B.e(s,t);B.e(t,w1,{sub:{ack:'before'}});B.e(t,w2,{sub:{maxAttempts:10}});B.e(t,w3,{sub:{maxAttempts:10}});

ex('Poison messages and dead-letter queues','Messaging','One malformed event. Three retry policies. Three very different outages.',

• B: keeps flowing; bad messages are counted as "parked" for a human to inspect.

ex('Inbox: handle inline vs. store first','Messaging','A consumer that processes each message while the broker waits, against one that stores it in an inbox table and works through it in batches.',
`Both workers consume the same kind of topic and write a ledger row inside a database transaction.

A handles each message inline. The broker waits for the handler; a failure after the commit, a duplicate delivery or a redelivery applies the write again.

B has an inbox (select ledger-B → "Inbox"). A message is stored and acknowledged at once; the row's "processed" flag commits together with the ledger write, so a re-run is a no-op and a message the inbox has already seen is ignored. A poller takes 20 rows every 200 ms.

What it costs: every message waits for the next poll, throughput is capped at batch ÷ interval (100 msg/s here), and there is one more table to run.

• "Duplicate deliveries (30%)": A's ledger gets double entries; B suppresses them.
• "Handler fails 20%": A duplicates whenever the failure lands after the commit. B retries from the inbox.
• "Traffic ×6": A keeps up. B's poller cannot — watch "inbox N" grow on ledger-B, then drain.`,B=>{
 const lane=(L,y,title,cfg)=>{B.note(L+' · '+title,250,y-52);
  const s=B.n('source','payments-'+L,20,y,{rateMin:15,rateMax:25}),t=B.n('kafka','payments-topic-'+L,260,y,{partitions:8}),w=B.n('worker','ledger-'+L,540,y,Object.assign({concurrency:8},cfg)),db=B.n('sql','ledger-db-'+L,810,y);
  B.e(s,t);const se=B.e(t,w);B.e(w,db,{act:{tx:true}});return{s,w,se}};
 const a=lane('A',70,'Inline — the broker waits for the handler',{});
 const b=lane('B',260,'Inbox — store, acknowledge, then poll 20 rows every 200 ms',{inbox:true,inboxPollMs:200,inboxBatch:20});
 B.sc('Duplicate deliveries (30%)','The network delivers some messages twice.',{[a.se]:{dup:30},[b.se]:{dup:30}});
 B.sc('Handler fails 20%','The handler throws at a random point — sometimes after its transaction has committed.',{[a.w]:{errorRate:20},[b.w]:{errorRate:20}});
 B.sc('Traffic ×6 (15 s)','More than the inbox poller can drain.',{[a.s]:{surge:6},[b.s]:{surge:6}},{heal:15});
 B.sc('Workers crash','In-flight work is lost. A waits for the broker to redeliver; B still has the rows.',{},{triggers:[{node:a.w,what:'crash'},{node:b.w,what:'crash'}]});
});

ex('The nightly batch: a spike on a schedule','Scalability','A scheduler releases 1,500 records at once. Send them straight at an API, buffer them in a topic, or throttle the release?',
`Each scheduler runs every 15 s (think "once a day") and releases 1,500 records. Select a scheduler to change the interval, the per-run pattern (try 0,0,3000 or 500-2500) or the spread.

A calls the import API directly. The API has 8 workers and a queue of 100: almost the whole batch is rejected within milliseconds.

B publishes the batch to a topic. Nothing is lost; the worker drains it at its own pace and the topic's lag shows the spike being absorbed.

C spreads the same batch over 10 s. The API never sees more than about 150 req/s.

• Compare "client ok" per flow in the Consistency audit.
• "Run the batches now" releases immediately instead of waiting for the timer.
• "Double-size batch": B's lag doubles and still drains; C is now too fast for its API.`,B=>{

ex('Deployments: canary vs. blue/green vs. highlander','Operations','Three ways to cut traffic over to a new build, and what each does when the build is bad or a host dies.',
`Each dashed box is an app group: one deployed build with 3 instances. v1 serves all traffic; v2 is the new build. Select a box to see its instances, traffic share, faults and the cut-over buttons.

A · Canary. v2 gets 5% → 25% → 50% → 100% of traffic. After each step its own error rate is checked and everything rolls back above 10%.

B · Blue/green. v2 runs alongside v1 at 0%. The switch is instant and so is rollback — but all users are on the new build at once, and you pay for two full copies.

C · Highlander ("there can be only one"). v1 is stopped, then v2 starts. Two versions never run at the same time (useful for singletons, schedulers and incompatible schemas), at the price of a gap with nothing serving, on the way out and on the way back.

• "Deploy a BAD build": v2 fails 40% of requests. Compare how many users each strategy exposes ("client ok" per flow) and how each recovers. Then press Heal all to roll B and C back.
• "Deploy a good build": only C has downtime.
• "One instance dies": requests routed to the dead host fail until it is detected (2 s), then the app runs at two thirds of its capacity.`,B=>{
 const lane=(L,y,title,v2cfg)=>{B.note(L+' · '+title,20,y-132);
  const c=B.n('client','users-'+L,20,y,{rateMin:20,rateMax:30,timeout:1500}),lb=B.n('lb','lb-'+L,250,y);
  const g1=B.g('api-'+L,490,y-104,216,122,{version:'v1',instances:3}),g2=B.g('api-'+L,490,y+30,216,122,Object.assign({version:'v2',instances:3,weight:0},v2cfg));
  const s1=B.n('service','api-'+L+'-v1',510,y-72,{concurrency:4}),s2=B.n('service','api-'+L+'-v2',510,y+62,{concurrency:4}),d=B.n('sql','db-'+L,800,y);
  B.e(c,lb);B.e(lb,s1);B.e(lb,s2);B.e(s1,d);B.e(s2,d);return{g1,g2}};
 const a=lane('A',120,'Canary — 5 → 25 → 50 → 100%, automatic rollback',{}),b=lane('B',420,'Blue/green — instant switch, both builds running',{}),c=lane('C',720,'Highlander — stop v1, then start v2',{stopped:true,weight:100});
 const co=[{group:a.g2,what:'cutover',from:a.g1,mode:'canary'},{group:b.g2,what:'cutover',from:b.g1,mode:'bluegreen'},{group:c.g2,what:'cutover',from:c.g1,mode:'highlander'}];
 B.sc('Deploy a BAD build (v2 fails 40%)','All three cut over to a build that fails 40% of requests. Heal all = roll back.',{[a.g2]:{errorRate:40},[b.g2]:{errorRate:40},[c.g2]:{errorRate:40}},{triggers:co});
 B.sc('Deploy a good build','The same three cut-overs with a healthy v2.',{},{triggers:co});
 B.sc('One instance dies in each v1','A host is lost. In-flight work on it is gone and it keeps receiving traffic until health checks notice.',{},{triggers:[{group:a.g1,what:'kill'},{group:b.g1,what:'kill'},{group:c.g1,what:'kill'}]});

});

/* ---------- run loop ---------- */
function setRun(v,keep){if(!keep&&follow){follow=null;sim.manual=manual}running=v;$('#bRun').textContent=v?'⏸ Pause':'▶ Run';document.body.classList.toggle('running',v)}
function resetSim(){healTok++;follow=null;oneTr=null;sim=new Sim(M,{vis:onVis});sim.manual=manual;parts=[];visT={};selTrace=null;sig={}}
function refresh(){$('#clock').textContent='t = '+(sim.t/1000).toFixed(follow?2:1)+' s'+(follow?' · following #'+follow.tr.id:'');$('#lag').style.display=sim.lagging?'block':'none';updNodes();updEdges();updGroups();updDock();liveInsp()}
let lastF=performance.now(),acc=0;
function frame(now){const dt=Math.min(100,now-lastF);lastF=now;if(running)sim.advance(dt*(follow?Math.min(speed,0.1):speed));

  h('div',{class:'cards'},EXAMPLES.map(x=>h('div',{class:'card',onclick:()=>{loadModel(x.build());closeModal()}},h('em',null,x.tag),h('b',null,x.name),h('span',null,x.blurb)))),

function showHelp(){showModal(h('h2',null,'How Faultline works',h('button',{onclick:closeModal},'Close')),h('ul',{class:'help',html:`
<li><b>Build.</b> Click or drag components from the left. Drag from a node's <b>●</b> to another node to connect them. Sources emit requests; a connection out of a <b>service</b> becomes one of its ordered <b>actions</b> (write a DB, publish an event, call an API). A connection out of a topic or queue is a <b>subscription</b>.</li>
<li><b>Configure.</b> Select a node or connection. For a service you can reorder actions, put DB writes in a transaction, publish through an outbox, and choose per action what a failure does (abort, ignore, compensate, fallback), with timeouts, retries and a circuit breaker.</li>
<li><b>Break it.</b> Every node and every connection has an <b>⚡ Inject faults</b> section: down, error rate, slow, hang, reduced capacity, crash, packet loss, lost responses, resets, corruption, duplicates, partitions, traffic surges, malformed data. Save a combination as a <b>failure scenario</b>; it is stored with the system.</li>
<li><b>Observe.</b> <b>Messages</b> view draws requests (blue), successful responses (green), errors (red) and drops (✕) — use 0.1× speed to follow a single request. <b>Flow</b> view shows aggregate rate and failure share per connection for high traffic.</li>
<li><b>Audit.</b> Every request is traced until all of its effects settle, then classified: clean, lost, duplicate, partial, ghost, corrupt, out of order, stale, parked. Click an anomaly for its timeline.</li>
<li><b>One message at a time.</b> Every source has a <b>▶ 1</b> button. While the clock is paused it sends a single message, runs in slow motion with all sources held until that message has settled, then pauses again; its hops are listed in the source's panel. <b>✋ Hold sources</b> silences automatic traffic while the clock keeps running.</li>
<li><b>Outbox and inbox.</b> A service's <b>Outbox relay</b> section sets how outbox rows are picked up (poll interval and batch size, or CDC), whether a batch is published in order, and when rows are marked as sent. Its <b>Inbox</b> section stores incoming messages first and processes them in polled batches.</li>
<li><b>Schedulers.</b> A Scheduler / Cron releases a batch every interval. "Messages per run" takes a repeating pattern such as <kbd>0,0,0,2000</kbd>, and the batch can be released at once or spread over a window.</li>
<li><b>App groups.</b> Add an <b>App / host group</b> and drop components into it. The group has instances (kill one, rolling restart), group-wide faults (bad build, slow host, isolated network) and a traffic share. With two groups behind the same load balancer, queue or consumer group id you can run a <b>canary</b>, <b>blue/green</b>, <b>highlander</b> or <b>A/B</b> cut-over and roll it back.</li>
<li><b>Recover.</b> <b>✚ Heal all</b> clears faults and returns app groups to their baseline traffic split. Watch how long the backlog takes to drain, and what was permanently lost.</li>
<li><b>Keys.</b> <kbd>Space</kbd> run / pause · <kbd>Del</kbd> delete selection · <kbd>Esc</kbd> deselect · scroll to zoom · drag the background to pan.</li>`}),
